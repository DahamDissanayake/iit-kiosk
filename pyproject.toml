[project]
name = "iit-kiosk"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "markdown-it-py>=3.0",
    "ncnn>=1.0.20240410",
    "numpy>=1.26",
    "onnxruntime>=1.18",
    "openvino>=2024.4",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "pyzmq>=26",
    "sounddevice>=0.4.7",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]
export = [
    "ultralytics>=8.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
