[project]
name = "iit-kiosk"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "argon2-cffi>=25.1.0",
    "fastapi>=0.115",
    "fastembed>=0.4",
    "httpx>=0.27",
    "itsdangerous>=2.2.0",
    "markdown-it-py>=3.0",
    "ncnn>=1.0.20240410",
    "numpy>=1.26",
    "onnxruntime>=1.18",
    "openvino>=2024.4",
    "piper-tts>=1.3",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "python-multipart>=0.0.32",
    "pyzmq>=26",
    "sounddevice>=0.4.7",
    "sqlite-vec>=0.1.6",
    "useful-moonshine-onnx>=20251121",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "opencv-python-headless>=5.0.0.93",
]
export = [
    "ultralytics>=8.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: needs downloaded models; run with RUN_SLOW=1"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# The LLM rules are written as long lines on purpose; wrapping would change what the model reads.
"core/llm/prompt.py" = ["E501"]
